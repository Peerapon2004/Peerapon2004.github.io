
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindAR - 3 Image Markers</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hint {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      padding: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 8px;
      text-align: center;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="hint">กำลังเปิดกล้อง AR...</div>

<a-scene
    mindar-image="imageTargetSrc: https://peerapon2004.github.io/targets (4).mind; maxTrack: 3;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="model0"
        src="https://Peerapon2004.github.io/animated_elephant_character.glb">
      </a-asset-item>

      <a-asset-item
        id="model1"
        src="https://Peerapon2004.github.io/cat_rigged_animation_run.glb">
      </a-asset-item>

      <a-asset-item
        id="model2"
        src="https://Peerapon2004.github.io/ghost.glb">
      </a-asset-item>
    </a-assets>

    <!-- Marker 1: รูปคนชุดขาวบนถนน -->
    <a-entity
      mindar-image-target="targetIndex: 0"
      id="marker0">

      <a-gltf-model
        src="#model0"
        animation-mixer
        rotation="90 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>
    </a-entity>

    <!-- Marker 2: รูปตัวละครพื้นหลังดวงจันทร์ -->
    <a-entity
      mindar-image-target="targetIndex: 1"
      id="marker1">

      <a-gltf-model
        src="#model1"
        animation-mixer
        rotation="90 0 0"
        scale="2 2 2">
      </a-gltf-model>
    </a-entity>

    <!-- Marker 3: รูปภาพที่สาม -->
    <a-entity
      mindar-image-target="targetIndex: 2"
      id="marker2">

      <a-gltf-model
        src="#model2"
        animation-mixer
        rotation="90 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>
    </a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

  </a-scene>

  <script>
    const hint = document.getElementById('hint');
    const scene = document.querySelector('a-scene');

    scene.addEventListener('arReady', () => {
      hint.textContent = 'กล้องพร้อมแล้ว ส่องไปที่รูป Marker';
    });

    scene.addEventListener('arError', () => {
      hint.textContent = 'เปิด AR ไม่สำเร็จ กรุณาตรวจสอบสิทธิ์กล้อง';
    });

    [0, 1, 2].forEach((index) => {
      const marker = document.getElementById('marker' + index);

      marker.addEventListener('targetFound', () => {
        hint.textContent = 'ตรวจพบ Marker ' + (index + 1);
      });

      marker.addEventListener('targetLost', () => {
        hint.textContent = 'ส่องกล้องไปที่รูป Marker';
      });
    });
  </script>
</body>
</html>
