
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ghost AR - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-extras@7.5.1/dist/aframe-extras.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      min-height: 100%;
      overscroll-behavior: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #hint {
      position: fixed;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,.72);
      color: white;
      text-align: center;
      font: 15px/1.4 Arial, sans-serif;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="hint">กำลังเริ่มกล้อง AR…</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true;"
    arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">

    <!-- Hiro Marker -->
    <a-marker id="hiro-marker" preset="hiro" emitevents="true">

      <!-- Ghost 3D Model -->
      <a-entity
        id="ghost-model"
        gltf-model="./ghost.glb"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.05 0.05 0.05"
        animation-mixer>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const hint = document.getElementById('hint');
    const marker = document.getElementById('hiro-marker');
    const model = document.getElementById('ghost-model');

    marker.addEventListener('markerFound', () => {
      hint.textContent = 'ตรวจพบ Hiro Marker แล้ว';
    });

    marker.addEventListener('markerLost', () => {
      hint.textContent = 'ส่องกล้องไปที่ Hiro Marker';
    });

    model.addEventListener('model-loaded', () => {
      hint.textContent = 'โหลด Ghost แล้ว — ส่องกล้องไปที่ Hiro Marker';
    });

    model.addEventListener('model-error', () => {
      hint.textContent = 'โหลด Ghost ไม่ได้: ตรวจสอบไฟล์ ghost.glb';
    });

    window.addEventListener('camera-init', () => {
      hint.textContent = 'กล้องพร้อมแล้ว — ส่องไปที่ Hiro Marker';
    });

    window.addEventListener('camera-error', () => {
      hint.textContent = 'เปิดกล้องไม่ได้ โปรดอนุญาตสิทธิ์กล้องและเปิดเว็บผ่าน HTTPS';
    });
  </script>
</body>
</html>
