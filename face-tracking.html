
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Face Tracking AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #hint {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      padding: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>
  <div id="hint">กำลังเริ่ม Face Tracking...</div>

  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="glassesModel"
        src="./heart-shaped_glasses.glb">
      </a-asset-item>

      <a-asset-item
        id="hatModel"
        src="./pirate_hat.glb">
      </a-asset-item>
    </a-assets>

    <!-- แว่น: anchor 168 อยู่บริเวณกึ่งกลางใบหน้า -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model
        src="#glassesModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.01 0.01 0.01">
      </a-gltf-model>
    </a-entity>

    <!-- หมวก: anchor 10 อยู่บริเวณหน้าผาก -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-gltf-model
        src="#hatModel"
        position="0 0.2 0"
        rotation="0 0 0"
        scale="0.01 0.01 0.01">
      </a-gltf-model>
    </a-entity>

    <a-camera active="false" position="0 0 0"></a-camera>

  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const hint = document.getElementById('hint');

    scene.addEventListener('arReady', () => {
      hint.textContent = 'กล้องพร้อมแล้ว กรุณาหันหน้าเข้าหากล้อง';
    });

    scene.addEventListener('arError', () => {
      hint.textContent = 'เปิดกล้องไม่สำเร็จ กรุณาตรวจสอบสิทธิ์กล้อง';
    });
  </script>
</body>
</html>
