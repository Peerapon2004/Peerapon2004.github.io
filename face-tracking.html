<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Tracking AR - Police Hat & Heart Glasses</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      /* สำคัญ: ห้ามใส่ background ที่ html/body ไม่งั้นบังวิดีโอกล้อง */
    }

    #ar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;            /* สร้าง stacking context ให้วิดีโอ (z-index ติดลบ) แสดงได้ */
    }

    #hint {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 12px 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }

    #retryButton {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="hint">กำลังโหลด Face Tracking...</div>
  <button id="retryButton">โหลดหน้าเว็บใหม่</button>

  <div id="ar-container">
    <a-scene
      mindar-face
      embedded
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="heartGlasses" src="./heart-shaped_glasses.glb"></a-asset-item>
        <a-asset-item id="policeHat" src="./police_hat.glb"></a-asset-item>
      </a-assets>

      <a-camera active="false" position="0 0 0"></a-camera>

      <!-- เพิ่มแสง ให้โมเดลไม่มืด -->
      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" intensity="0.8" position="0 1 1"></a-light>

      <!-- แว่นหัวใจ: กึ่งกลางระหว่างดวงตา -->
      <a-entity mindar-face-target="anchorIndex: 168">
        <a-gltf-model
          id="glasses"
          src="#heartGlasses"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.1 0.1 0.1">
        </a-gltf-model>
      </a-entity>

      <!-- หมวกตำรวจ: หน้าผาก -->
      <a-entity mindar-face-target="anchorIndex: 10">
        <a-gltf-model
          id="policeHatModel"
          src="#policeHat"
          position="0 0.2 0"
          rotation="0 0 0"
          scale="0.1 0.1 0.1">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </div>

  <script>
    const scene = document.querySelector("a-scene");
    const hint = document.getElementById("hint");
    const retryButton = document.getElementById("retryButton");

    retryButton.addEventListener("click", () => window.location.reload());

    scene.addEventListener("loaded", () => {
      hint.textContent = "กำลังเริ่มกล้อง กรุณาอนุญาตการใช้กล้อง";
    });

    scene.addEventListener("arReady", () => {
      hint.textContent = "กล้องพร้อมแล้ว กรุณาหันหน้าเข้าหากล้อง";
      retryButton.style.display = "none";
    });

    scene.addEventListener("arError", (event) => {
      console.error("MindAR error:", event);
      hint.textContent = "เริ่มกล้องไม่สำเร็จ กรุณาตรวจสอบสิทธิ์กล้อง";
      retryButton.style.display = "block";
    });

    ["glasses", "policeHatModel"].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener("model-loaded", () => console.log(id, "loaded"));
      el.addEventListener("model-error", (e) => console.error(id, "failed", e));
    });
  </script>
</body>
</html>
