
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Blend Shape AR</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #video, #renderCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #video { z-index: 0; }
    #renderCanvas {
      z-index: 1;
      pointer-events: none;
    }

    #panel {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      right: 12px;
      max-width: 420px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
    }

    #title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    #status {
      font-size: 13px;
      color: #b9e7ff;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    #startButton {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #1687ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #meters {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .track {
      height: 5px;
      border-radius: 10px;
      background: #444;
      overflow: hidden;
    }

    .fill {
      width: 0%;
      height: 100%;
      background: #45c4ff;
      transition: width 60ms linear;
    }

    #help {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.5;
      color: #ccc;
    }

    @media (max-width: 480px) {
      #panel { max-width: none; }
    }
  </style>
</head>

<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="renderCanvas"></canvas>

  <section id="panel">
    <div id="title">Face Blend Shape AR</div>
    <div id="status">
      กดเริ่มใช้งาน แล้วอนุญาตให้เว็บไซต์ใช้กล้อง
    </div>
    <button id="startButton">เริ่มใช้งานกล้อง</button>

    <div id="meters">
      <div>
        <div class="meter-label">
          <span>กะพริบตาซ้าย</span><span id="v-blinkL">0%</span>
        </div>
        <div class="track"><div class="fill" id="b-blinkL"></div></div>
      </div>

      <div>
        <div class="meter-label">
          <span>กะพริบตาขวา</span><span id="v-blinkR">0%</span>
        </div>
        <div class="track"><div class="fill" id="b-blinkR"></div></div>
      </div>

      <div>
        <div class="meter-label">
          <span>อ้าปาก</span><span id="v-jaw">0%</span>
        </div>
        <div class="track"><div class="fill" id="b-jaw"></div></div>
      </div>

      <div>
        <div class="meter-label">
          <span>ยิ้ม</span><span id="v-smile">0%</span>
        </div>
        <div class="track"><div class="fill" id="b-smile"></div></div>
      </div>
    </div>

    <div id="help">
      ลองกะพริบตา อ้าปาก และยิ้ม เพื่อทดสอบค่า Blend Shape
      หากไม่พบใบหน้า ระบบจะแสดงค่าเป็น 0%
    </div>
  </section>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    import { GLTFLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("renderCanvas");
    const statusText = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    let faceLandmarker;
    let modelRoot;
    let renderer;
    let camera3D;
    let scene3D;
    let modelReady = false;
    let running = false;
    let lastVideoTime = -1;
    let lastStatusUpdate = 0;
    let morphMeshes = [];
    let modelWidth = 1;
    let modelHeight = 1;

    const smoothed = {};

    const uiNames = {
      "eyeBlinkLeft": "blinkL",
      "eyeBlinkRight": "blinkR",
      "jawOpen": "jaw",
      "mouthSmileLeft": "smileL",
      "mouthSmileRight": "smileR",
      "mouthFrownLeft": "frownL",
      "mouthFrownRight": "frownR"
    };

    const scene = new THREE.Scene();

    camera3D = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
    camera3D.position.set(0, 0, 5);

    renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene3D = scene;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777788, 2));

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(1, 2, 4);
    scene.add(light);

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      renderer.setSize(width, height, false);
      camera3D.aspect = width / height;
      camera3D.updateProjectionMatrix();
    }

    window.addEventListener("resize", resize);
    resize();

    function setStatus(message) {
      statusText.textContent = message;
    }

    function setMeter(id, value) {
      const percent = Math.round(
        THREE.MathUtils.clamp(value || 0, 0, 1) * 100
      );

      const label = document.getElementById("v-" + id);
      const fill = document.getElementById("b-" + id);

      if (label) label.textContent = percent + "%";
      if (fill) fill.style.width = percent + "%";
    }

    function resetMeters() {
      setMeter("blinkL", 0);
      setMeter("blinkR", 0);
      setMeter("jaw", 0);
      setMeter("smile", 0);

      Object.keys(smoothed).forEach(key => {
        smoothed[key] = 0;
      });

      updateMorphTargets({});
    }

    function updateMorphTargets(values) {
      for (const mesh of morphMeshes) {
        const dict = mesh.morphTargetDictionary;
        const influences = mesh.morphTargetInfluences;

        if (!dict || !influences) continue;

        for (const [name, index] of Object.entries(dict)) {
          const value = values[name] ?? 0;
          influences[index] = THREE.MathUtils.clamp(value, 0, 1);
        }
      }
    }

    async function loadModel() {
      setStatus("กำลังโหลดโมเดล Blend_shape_Jay.glb...");

      const loader = new GLTFLoader();

      const gltf = await loader.loadAsync("./Blend_shape_Jay.glb");
      modelRoot = gltf.scene;

      modelRoot.traverse(object => {
        if (object.isMesh) {
          object.frustumCulled = false;
          morphMeshes.push(object);
        }
      });

      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      if (size.x <= 0 || size.y <= 0) {
        throw new Error("โมเดลไม่มีขนาดที่ถูกต้อง");
      }

      modelWidth = size.x;
      modelHeight = size.y;

      // ย้ายจุดอ้างอิงไปที่กึ่งกลางโมเดล
      modelRoot.position.sub(center);

      scene.add(modelRoot);

      // ตรวจสอบว่ามี Morph Targets ในโมเดลหรือไม่
      const targets = [];

      for (const mesh of morphMeshes) {
        const dict = mesh.morphTargetDictionary || {};
        targets.push(...Object.keys(dict));
      }

      console.log("Morph Targets found:", [...new Set(targets)]);

      if (targets.length === 0) {
        throw new Error("โมเดลนี้ไม่มี Morph Targets ที่ใช้งานได้");
      }

      modelReady = true;
    }

    async function loadFaceLandmarker() {
      setStatus("กำลังโหลดระบบตรวจจับสีหน้า...");

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true,
        outputFacialTransformationMatrixes: false
      });
    }

    function getBlendshapeValues(result) {
      const values = {};

      const categories = result.faceBlendshapes?.[0]?.categories || [];

      for (const category of categories) {
        values[category.categoryName] = category.score;
      }

      return values;
    }

    function updateExpression(values) {
      const keys = [
        "eyeBlinkLeft",
        "eyeBlinkRight",
        "jawOpen",
        "mouthSmileLeft",
        "mouthSmileRight",
        "mouthFrownLeft",
        "mouthFrownRight",
        "eyeLookDownLeft",
        "eyeLookInLeft",
        "eyeLookOutLeft",
        "eyeLookUpLeft",
        "eyeLookDownRight",
        "eyeLookInRight",
        "eyeLookOutRight",
        "eyeLookUpRight"
      ];

      const output = {};

      for (const key of keys) {
        const raw = values[key] || 0;

        // Smooth the values to reduce jitter.
        if (smoothed[key] === undefined) {
          smoothed[key] = raw;
        } else {
          smoothed[key] += (raw - smoothed[key]) * 0.35;
        }

        output[key] = smoothed[key];
      }

      updateMorphTargets(output);

      setMeter("blinkL", output.eyeBlinkLeft);
      setMeter("blinkR", output.eyeBlinkRight);
      setMeter("jaw", output.jawOpen);

      setMeter(
        "smile",
        Math.max(output.mouthSmileLeft, output.mouthSmileRight)
      );
    }

    function placeModel(result) {
      if (!modelReady) return;

      const landmarks = result.faceLandmarks?.[0];

      if (!landmarks || landmarks.length < 264) return;

      // MediaPipe face landmarks: nose tip and outer eye corners.
      const nose = landmarks[1];
      const leftEye = landmarks[33];
      const rightEye = landmarks[263];

      const width = window.innerWidth;
      const height = window.innerHeight;

      // Match the video's object-fit: cover crop.
      const videoWidth = video.videoWidth || width;
      const videoHeight = video.videoHeight || height;

      const coverScale = Math.max(
        width / videoWidth,
        height / videoHeight
      );

      const renderedWidth = videoWidth * coverScale;
      const renderedHeight = videoHeight * coverScale;

      const offsetX = (renderedWidth - width) / 2;
      const offsetY = (renderedHeight - height) / 2;

      function toScreen(point) {
        return {
          x: point.x * renderedWidth - offsetX,
          y: point.y * renderedHeight - offsetY
        };
      }

      const noseScreen = toScreen(nose);
      const leftScreen = toScreen(leftEye);
      const rightScreen = toScreen(rightEye);

      const eyeDistance = Math.hypot(
        rightScreen.x - leftScreen.x,
        rightScreen.y - leftScreen.y
      );

      if (eyeDistance < 5) return;

      // Convert screen position to 3D coordinates at z = 0.
      const visibleHeight =
        2 * camera3D.position.z *
        Math.tan(THREE.MathUtils.degToRad(camera3D.fov / 2));

      const worldPerPixel = visibleHeight / height;

      const ndcX = (noseScreen.x / width) * 2 - 1;
      const ndcY = 1 - (noseScreen.y / height) * 2;

      const point3D = new THREE.Vector3(ndcX, ndcY, 0);
      point3D.unproject(camera3D);

      const desiredWidth = eyeDistance * worldPerPixel * 2.2;
      const scale = desiredWidth / modelWidth;

      modelRoot.scale.setScalar(scale);

      // Position the model around the user's nose.
      // The model's center is used as the initial alignment reference.
      modelRoot.position.x = point3D.x;
      modelRoot.position.y = point3D.y;

      // Estimate head roll from the eye line.
      const roll = Math.atan2(
        rightScreen.y - leftScreen.y,
        rightScreen.x - leftScreen.x
      );

      modelRoot.rotation.z = -roll;

      // Keep the model in front of the camera.
      modelRoot.position.z = 0;
    }

    async function start() {
      startButton.disabled = true;

      try {
        setStatus("กำลังขออนุญาตใช้กล้อง...");

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        await loadModel();
        await loadFaceLandmarker();

        running = true;
        setStatus("พร้อมแล้ว! ลองยิ้ม อ้าปาก และกะพริบตา");
        startButton.textContent = "กำลังทำงาน";
        requestAnimationFrame(detectLoop);

      } catch (error) {
        console.error(error);

        setStatus(
          "เริ่มระบบไม่สำเร็จ: " +
          (error.message || "กรุณาตรวจสอบกล้องและไฟล์โมเดล")
        );

        startButton.disabled = false;
        startButton.textContent = "ลองเริ่มใหม่";
      }
    }

    function detectLoop() {
      if (!running) return;

      requestAnimationFrame(detectLoop);

      if (
        !faceLandmarker ||
        video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
        video.currentTime === lastVideoTime
      ) {
        renderer.render(scene, camera3D);
        return;
      }

      lastVideoTime = video.currentTime;

      try {
        const result = faceLandmarker.detectForVideo(
          video,
          performance.now()
        );

        if (result.faceLandmarks?.length) {
          const values = getBlendshapeValues(result);
          updateExpression(values);
          placeModel(result);

          const now = performance.now();

          if (now - lastStatusUpdate > 500) {
            setStatus("ตรวจพบใบหน้า • กำลังติดตามสีหน้า");
            lastStatusUpdate = now;
          }
        } else {
          resetMeters();
          setStatus("ไม่พบใบหน้า กรุณาหันหน้าเข้าหากล้อง");
        }

        renderer.render(scene, camera3D);

      } catch (error) {
        console.error("Face detection error:", error);
      }
    }

    startButton.addEventListener("click", start);

    // Draw an empty transparent scene before starting the camera.
    renderer.render(scene, camera3D);
  </script>
</body>
</html>
