
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Face Texture AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font: 14px Arial, sans-serif;
      text-align: center;
      max-width: 85%;
    }
  </style>
</head>

<body>
  <div id="status">Loading Face Texture AR...</div>

  <a-scene
    mindar-face="faceOccluder: false"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; alpha: true"
  >
    <a-entity
      id="face"
      mindar-face-default-face-occluder
    ></a-entity>

    <a-camera
      active="false"
      position="0 0 0"
    ></a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const status = document.querySelector("#status");

    scene.addEventListener("arReady", async () => {
      try {
        const THREE = AFRAME.THREE;

        // Load the texture image from the same GitHub Pages folder.
        const texture = await new THREE.TextureLoader().loadAsync(
          "./canonical_face_model_uv_visualization.png"
        );

        texture.colorSpace = THREE.SRGBColorSpace;

        // Get the face mesh created by MindAR.
        const faceEntity = document.querySelector("#face");
        const faceMesh = faceEntity.getObject3D("mesh");

        if (!faceMesh) {
          throw new Error("Face mesh was not found.");
        }

        // Apply the image to the face mesh.
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 1
        });

        faceMesh.material.dispose();
        faceMesh.material = material;
        faceMesh.frustumCulled = false;

        status.textContent = "Face Texture AR is ready";

        setTimeout(() => {
          status.style.display = "none";
        }, 2500);

      } catch (error) {
        console.error("Face Texture Error:", error);
        status.textContent =
          "Could not load the texture. Check the image file path.";
      }
    });

    scene.addEventListener("arError", () => {
      status.textContent =
        "Camera or AR initialization failed. Please check permissions.";
    });
  </script>
</body>
</html>
